name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  teste:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: agent, POSTGRES_PASSWORD: agent, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://agent:agent@localhost:5432/rtc_teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements-dev.txt
      - run: python -m pytest -q
